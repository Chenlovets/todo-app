<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 24px; }
  form.add { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text] { flex: 1; padding: 8px 10px; font-size: 16px; border: 1px solid #c4c8cf; border-radius: 6px; }
  button { padding: 8px 12px; font-size: 14px; border: 0; border-radius: 6px; background: #3b6fd4; color: #fff; cursor: pointer; }
  button.secondary { background: #e3e6ea; color: #222; }
  button.danger { background: #d4483b; }
  #error { color: #b3261e; min-height: 20px; margin: 4px 0 8px; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 8px; background: #fff; padding: 10px; margin-bottom: 6px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  li .title { flex: 1; word-break: break-word; }
  li.done .title { text-decoration: line-through; color: #888; }
  #empty { color: #777; text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<main>
  <h1>To-Do</h1>
  <form class="add" id="add-form">
    <input type="text" id="new-title" placeholder="What needs doing?" autocomplete="off" aria-label="New task title">
    <button type="submit">Add</button>
  </form>
  <div id="error" role="alert"></div>
  <ul id="list"></ul>
  <div id="empty" hidden>No tasks yet. Add one above.</div>
</main>
<script>
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const errorBox = document.getElementById('error');
let editingId = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'request failed (' + res.status + ')');
  return data;
}

function showError(e) { errorBox.textContent = e ? e.message : ''; }

async function load() {
  try {
    render(await api('GET', '/api/tasks'));
    showError(null);
  } catch (e) { showError(e); }
}

// run performs an action, then reloads the list; errors are shown inline.
async function run(fn) {
  try { await fn(); showError(null); } catch (e) { showError(e); }
  await load();
}

function button(label, cls, onclick) {
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = onclick;
  return b;
}

function render(tasks) {
  list.replaceChildren();
  empty.hidden = tasks.length > 0;
  for (const t of tasks) {
    const li = document.createElement('li');
    li.dataset.id = t.id;
    if (t.completed) li.className = 'done';

    if (editingId === t.id) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = t.title;
      input.setAttribute('aria-label', 'Edit title');
      const save = () => run(async () => { await api('PUT', '/api/tasks/' + t.id, { title: input.value }); editingId = null; });
      input.onkeydown = (e) => { if (e.key === 'Enter') save(); if (e.key === 'Escape') { editingId = null; load(); } };
      li.append(input, button('Save', '', save), button('Cancel', 'secondary', () => { editingId = null; load(); }));
      list.append(li);
      input.focus();
      continue;
    }

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = t.completed;
    cb.setAttribute('aria-label', 'Completed');
    cb.onchange = () => run(() => api('PATCH', '/api/tasks/' + t.id + '/toggle'));

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = t.title; // textContent: never interpret titles as HTML

    li.append(cb, title,
      button('Edit', 'secondary', () => { editingId = t.id; load(); }),
      button('Delete', 'danger', () => run(() => api('DELETE', '/api/tasks/' + t.id))));
    list.append(li);
  }
}

document.getElementById('add-form').onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById('new-title');
  run(async () => { await api('POST', '/api/tasks', { title: input.value }); input.value = ''; });
};

load();
</script>
</body>
</html>
